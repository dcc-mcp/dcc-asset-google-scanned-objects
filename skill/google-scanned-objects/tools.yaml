tools:
  - name: search_google_scanned_objects
    description: Search Google Scanned Objects on Gazebo Fuel.
    source_file: scripts/search_google_scanned_objects.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: google-scanned-objects
    input_schema:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    output_schema:
      type: object

  - name: list_google_scanned_object_files
    description: List files for one Google Scanned Object model.
    source_file: scripts/list_google_scanned_object_files.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: google-scanned-objects
    input_schema:
      type: object
      required: ["model_name"]
      properties:
        model_name:
          type: string
    output_schema:
      type: object

  - name: download_google_scanned_object
    description: Download all files for one Google Scanned Object model.
    source_file: scripts/download_google_scanned_object.py
    execution: sync
    affinity: any
    timeout_hint_secs: 600
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: google-scanned-objects
    input_schema:
      type: object
      required: ["model_name", "output_dir"]
      properties:
        model_name:
          type: string
        output_dir:
          type: string
    output_schema:
      type: object
